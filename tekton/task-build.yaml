apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: tax-calculator-build
spec:
  params:
    - name: IMAGE
      type: string
  workspaces:
    - name: source
  steps:
    - name: build
      image: docker:27-cli
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        docker build -t $(params.IMAGE) .
