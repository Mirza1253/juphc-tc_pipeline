<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tax Calculator</title><link rel="stylesheet" href="/style.css"></head><body><main class="container"><section class="card"><h1>Tax Calculator</h1><p>Calculate estimated tax from annual income.</p><form id="tax-form"><label for="income">Annual Income (£)</label><input id="income" type="number" min="0" step="0.01" required placeholder="e.g. 50000"><button>Calculate Tax</button></form><p id="error"></p><section id="result" class="result" hidden><div>Annual Income <b id="income-result"></b></div><div>Estimated Tax <b id="tax-result"></b></div><div>Net Income <b id="net-result"></b></div></section><small>This demo is for the software assignment and is not professional tax advice.</small></section></main><script src="/app.js"></script></body></html>
